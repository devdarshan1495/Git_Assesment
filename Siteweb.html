<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            padding: 20px;
            width: 300px;
            text-align: center;
        }
        input[type="number"] {
            width: calc(100% - 24px);
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Calculator</h1>
        <p>Enter two numbers below:</p>
        <input type="number" id="num1" placeholder="Enter first number">
        <input type="number" id="num2" placeholder="Enter second number">
        <button onclick="calculateResults()">Calculate</button>
        <div id="results" class="result"></div>
    </div>

    <script>
        function calculateResults() {
            const num1 = parseFloat(document.getElementById('num1').value);
            const num2 = parseFloat(document.getElementById('num2').value);

            if (isNaN(num1) || isNaN(num2)) {
                document.getElementById('results').innerHTML = '<p>Please enter valid numbers!</p>';
                return;
            }

            const Sum = num1 + num2;
            const Difference = num1 - num2;
            const Product = num1 * num2;
            const quotient = num2 !== 0 ? (num1 / num2).toFixed(2) : 'Undefined';

            document.getElementById('results').innerHTML = `
                <p><strong>Sum:</strong> ${sum}</p>
                <p><strong>Difference:</strong> ${difference}</p>
                <p><strong>Product:</strong> ${product}</p>
                <p><strong>Quotient:</strong> ${quotient}</p>
            `;
        }
    </script>
</body>
</html>
